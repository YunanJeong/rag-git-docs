[project]
name = "rag-git-docs"
version = "0.1.0"
description = "git 호스팅의 문서를 모아 벡터 DB 로 검색하는 RAG 파이프라인"
requires-python = ">=3.11"
dependencies = [
    "FlagEmbedding==1.4.2",
    "qdrant-client==1.19.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
