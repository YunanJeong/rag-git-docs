[project]
name = "rag-git-docs"
version = "0.1.0"
description = "GitLab·GitHub 문서를 Qdrant 에 색인하고 MCP 로 검색한다"
requires-python = ">=3.11"
dependencies = [
    "FlagEmbedding==1.4.2",
    "mcp==2.2.0",
    "qdrant-client==1.19.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
