[project]
name = "rag-git-docs"
version = "0.1.0"
description = "git 호스팅의 문서를 모아 색인하고 MCP 로 에이전트에 검색을 제공하는 RAG 파이프라인"
requires-python = ">=3.11"
dependencies = [
    "FlagEmbedding==1.4.2",
    "mcp==2.2.0",
    "qdrant-client==1.19.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
