# collect.py 다음 index.py 를 매일 한 번 돌린다. 수집 방식과 위치는 env 의 COLLECT_MODE, DOCS_DIR 이 정한다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "rag.fullname" . }}-sync
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync
spec:
  schedule: {{ .Values.sync.schedule | quote }}
  {{- with .Values.sync.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  suspend: {{ .Values.sync.suspend }}
  # 색인이 길어져 다음 실행과 겹치면 같은 문서 디렉터리를 둘이 동시에 건드린다. 겹치면 건너뛴다.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.sync.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.sync.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "rag.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: sync
          {{- with .Values.sync.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: sync
              image: {{ include "rag.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # collect.py 의 종료 코드를 index.py 에 넘긴다. 3 이면 바뀐 문서가 없어 색인을 건너뛴다.
              # 리포 하나만 실패해도(1) 색인은 돌린다. 실패한 리포는 옛 파일이 그대로 남아 있다.
              command: ["sh", "-c", "python collect.py; COLLECT_EXIT=$? python index.py"]
              {{- with .Values.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              envFrom:
                - secretRef:
                    name: {{ include "rag.secretName" . }}
              env:
                {{- include "rag.env" .Values.env | trim | nindent 16 }}
                {{- include "rag.env" .Values.sync.env | trim | nindent 16 }}
                {{- include "rag.qdrantEnv" . | nindent 16 }}
              resources:
                {{- toYaml .Values.sync.resources | nindent 16 }}
              volumeMounts:
                - name: docs
                  mountPath: /data
                - name: model
                  mountPath: /cache/hf
          volumes:
            - name: docs
              persistentVolumeClaim:
                claimName: {{ include "rag.fullname" . }}-docs
            - name: model
              persistentVolumeClaim:
                claimName: {{ include "rag.fullname" . }}-model
          {{- with .Values.sync.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.sync.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.sync.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
