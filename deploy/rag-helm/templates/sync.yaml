# collect.py 다음 index.py 를 매일 한 번 돌린다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-sync
spec:
  schedule: {{ .Values.schedule | quote }}
  # 색인이 길어져 다음 실행과 겹치면 같은 문서 디렉터리를 둘이 동시에 건드린다. 겹치면 건너뛴다.
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          {{- with .Values.image.pullSecret }}
          imagePullSecrets:
            - name: {{ . }}
          {{- end }}
          containers:
            - name: sync
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
                  # collect.py 는 리포 하나만 실패해도 종료 코드 1 로 끝난다.
              # 그래도 색인은 돌리도록 && 대신 ; 로 잇는다. 실패한 리포는 옛 파일이 그대로 남아 있다.
              command: ["sh", "-c", "python collect.py; python index.py"]
              envFrom:
                - secretRef:
                    name: {{ .Release.Name }}-env
              env:
                {{- range $k, $v := .Values.env }}
                - name: {{ $k }}
                  value: {{ $v | quote }}
                {{- end }}
                - name: DOCS_DIR
                  value: /data/docs
                - name: QDRANT_URL
                  value: {{ .Values.qdrant.url }}
                - name: QDRANT_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.qdrant.apiKeySecret }}
                      key: api-key
              volumeMounts:
                - name: docs
                  mountPath: /data
                - name: model
                  mountPath: /cache/hf
          volumes:
            - name: docs
              persistentVolumeClaim:
                claimName: {{ .Release.Name }}-docs
            - name: model
              persistentVolumeClaim:
                claimName: {{ .Release.Name }}-model
