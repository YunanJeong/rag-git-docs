# 수집한 md 와 .manifest.json 을 둔다.
# 없으면 매번 빈 디렉터리로 시작해서 매일 전부 다시 받는다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-docs
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: {{ .Values.storage.docs }}
---
# bge-m3 모델(2.3GB)을 받아 둔다.
# 없으면 서버가 뜰 때마다, 색인이 돌 때마다 모델을 새로 받는다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-model
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: {{ .Values.storage.model }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-env
stringData:
  {{- range $k, $v := .Values.secretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
