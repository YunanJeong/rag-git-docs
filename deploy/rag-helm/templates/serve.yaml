# serve.py 를 계속 띄워 둔다. 죽으면 k8s 가 다시 띄운다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-serve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-serve
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-serve
    spec:
      {{- with .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: serve
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["python", "serve.py"]
          envFrom:
            # SERVE_TOKEN 을 여기서 읽는다
            - secretRef:
                name: {{ .Release.Name }}-env
          env:
            - name: QDRANT_URL
              value: {{ .Values.qdrant.url }}
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.qdrant.apiKeySecret }}
                  key: api-key
          ports:
            - containerPort: 8765
          volumeMounts:
            - name: model
              mountPath: /cache/hf
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-model
---
# NodePort 는 노드 IP 의 지정한 포트로 클러스터 밖에서 붙게 한다.
# 누가 붙을 수 있는지는 EC2 보안그룹에서 이 포트를 열 IP 로 정한다.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-serve
spec:
  type: NodePort
  selector:
    app: {{ .Release.Name }}-serve
  ports:
    - port: 8765
      targetPort: 8765
      nodePort: {{ .Values.serve.nodePort }}
