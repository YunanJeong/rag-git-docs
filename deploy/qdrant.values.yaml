# Qdrant 공식 차트 기본값 위에 덮어쓰는, 이 환경의 값이다.
# 단일 노드 k3s 를 기준으로 한다.

# ports 는 목록이라 일부만 적으면 나머지가 사라진다.
# 그래서 차트 기본값 세 개를 모두 적고 http 에만 nodePort 를 붙인다.
# NodePort 는 노드의 IP 와 지정한 포트로 클러스터 밖에서 서비스에 붙게 한다.
# 색인과 검색은 클러스터 밖 호스트에서 돌기 때문에 이 경로가 필요하다.
# nodePort 는 30000 에서 32767 사이 값만 쓸 수 있다.
service:
  type: NodePort
  ports:
    - name: http
      port: 6333
      targetPort: 6333
      nodePort: 30633
      protocol: TCP
      checksEnabled: true
    - name: grpc
      port: 6334
      targetPort: 6334
      protocol: TCP
      checksEnabled: false
    - name: p2p
      port: 6335
      targetPort: 6335
      protocol: TCP
      checksEnabled: false

# local-path 는 k3s 에 기본으로 들어 있는 스토리지 클래스다.
# 노드 디스크의 디렉터리를 볼륨으로 쓰므로 파드가 다시 떠도 데이터가 남는다.
# 노드 자체를 지우면 데이터도 함께 사라진다.
persistence:
  storageClassName: local-path

# Qdrant API 키를 차트가 만들어 rag-qdrant-apikey Secret 에 둔다.
# 이미 있으면 그 값을 다시 쓰므로 helm upgrade 를 해도 키가 바뀌지 않는다.
# 앱은 같은 Secret 에서 Qdrant API 키를 읽는다.
apiKey: true
