# 이 배포의 Qdrant 값. 공식 Qdrant 차트(deploy/packages/qdrant-*.tgz)에 넘긴다.
service:
  type: NodePort
  ports:
    - name: http
      port: 6333
      targetPort: 6333
      nodePort: 30633
      protocol: TCP
      checksEnabled: true
    - name: grpc
      port: 6334
      targetPort: 6334
      protocol: TCP
      checksEnabled: false
    - name: p2p
      port: 6335
      targetPort: 6335
      protocol: TCP
      checksEnabled: false

persistence:
  storageClassName: local-path

apiKey: true
