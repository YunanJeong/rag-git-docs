# rag-git-docs 를 설치할 때 함께 넘기는 토큰이다.
# rag-git-docs.secret.yaml 로 복사해 값을 채운다. 복사한 파일은 .gitignore 에 있어 커밋되지 않는다.
secretEnv:
  # 검색 서버 토큰이다. Claude Code 가 검색 서버에 붙을 때 쓴다. 비어 있으면 검색 서버가 뜨지 않는다.
  # openssl rand -hex 32 로 만든다.
  SERVE_TOKEN: ""
  # GitLab 토큰이다. 스코프는 read_api 가 필요하다.
  GITLAB_TOKEN: ""
  # SOURCE 를 github 로 바꿨을 때만 채운다.
  GITHUB_TOKEN: ""
