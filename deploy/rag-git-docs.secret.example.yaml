# rag-git-docs 를 설치할 때 함께 넘기는 토큰이다.
# rag-git-docs.secret.yaml 로 복사해 값을 채운다. 복사한 파일은 .gitignore 에 있어 커밋되지 않는다.
secretEnv:
  # 검색 서버 토큰이다. 사람마다 '이름:토큰' 을 쉼표로 잇는다. 예: "kim:<토큰>,lee:<토큰>"
  # 토큰은 openssl rand -hex 32 로 만든다. 비어 있거나 형식이 틀리면 검색 서버가 뜨지 않는다.
  SERVE_TOKEN: "yunan:1234,user2:5678"
  # GitLab 토큰이다. 스코프는 read_api 면 된다. COLLECT_MODE 가 clone 일 때의 git clone·fetch 도 이 스코프로 된다.
  GITLAB_TOKEN: ""
  # SOURCE 를 github 로 바꿨을 때만 채운다.
  GITHUB_TOKEN: ""
