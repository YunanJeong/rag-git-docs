# clone 모드 릴리스의 값. api 모드와 네임스페이스를 나눠 띄우며, 이 파일 하나로 설치한다.

image:
  repository: docker.wai/yunan/rag-git-docs
  tag: "0.5.0"

# 수집·색인과 검색 MCP 서버에 같이 넣는 환경변수. 수집 방식과 문서 위치, Qdrant 별칭을 정한다.
env:
  COLLECT_MODE: clone
  DOCS_DIR: /data/repos
  QDRANT_ALIAS: docs-clone

# 같은 네임스페이스에 띄운 Qdrant(릴리스 rag-qdrant)의 주소와 API 키 Secret.
qdrant:
  url: http://rag-qdrant:6333
  apiKeySecret:
    name: rag-qdrant-apikey

# 검색 MCP 서버. 노드 포트는 api 쪽과 겹치지 않게 한다.
serve:
  service:
    type: NodePort
    nodePort: 30877

# 수집·색인 CronJob. 한 노드에서 자원을 다투지 않게 api 쪽과 시각을 엇갈린다.
sync:
  schedule: "0 4 * * *"
  timeZone: Asia/Seoul
  env:
    GITLAB_GROUP: ""
    # GITLAB_URL: https://gitlab.example.com

persistence:
  storageClass: local-path
  docs:
    size: 70Gi
