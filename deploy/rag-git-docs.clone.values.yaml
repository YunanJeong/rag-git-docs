# clone 모드 PoC 를 api 모드와 같은 노드에 동시에 띄울 때, rag-git-docs.values.yaml 위에 덮어쓰는 값이다.
# 네임스페이스와 릴리스를 따로 두므로 PVC·Service·Secret 은 저절로 따로 생긴다. 여기서는 겹치면 안 되는 것만 바꾼다.
# helm install rag-git-docs ... -n rag-clone -f rag-git-docs.values.yaml -f rag-git-docs.clone.values.yaml -f rag-git-docs.secret.yaml

env:
  COLLECT_MODE: clone
  DOCS_DIR: /data/repos
  # Qdrant 별칭. Qdrant 가 따로라 겹치지는 않지만, 어느 쪽 색인인지 이름으로 구별되게 한다.
  QDRANT_ALIAS: docs-clone

# Qdrant 주소(qdrant.url)는 그대로 둔다. 같은 네임스페이스에 rag-qdrant 를 따로 띄우므로 이름이 같아도 다른 Qdrant 다.

# 노드 포트는 클러스터 전체에서 하나라 api 쪽(30876)과 다르게 연다.
serve:
  service:
    nodePort: 30877

# 두 CronJob 이 같은 시각에 돌면 한 노드의 CPU·메모리를 다툰다. api 쪽(03:00)과 시각을 엇갈린다.
sync:
  schedule: "0 4 * * *"

# 리포 전체와 이력이 들어간다. local-path 는 크기를 강제하지 않지만, 노드 디스크에 그만큼 여유가 있어야 한다.
persistence:
  docs:
    size: 160Gi
