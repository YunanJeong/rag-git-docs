# 이 환경(EC2 위 단일 노드 k3s)에 rag-git-docs 를 설치할 때 차트 기본값 위에 덮어쓰는 값이다.
# 여기 없는 항목은 차트 기본값(charts/rag-git-docs/values.yaml)을 그대로 쓴다.
# 토큰은 여기 적지 않고 rag-git-docs.secret.yaml 에 적는다.

# 이미지를 받을 레지스트리 주소다. push 할 때 주소와 다를 수 있다.
# 앱 코드만 바뀌면 차트를 다시 패키징하지 않고 tag 만 올려 helm upgrade 한다.
image:
  repository: docker.wai/yunan/rag-git-docs
  tag: "0.5.0"

# 수집·색인과 검색 서버에 같이 들어가는 환경변수다. 수집 방식은 여기서 고른다. 고르는 이유는 README 에 있다.
# clone PoC 를 하려면 아래 두 줄의 주석을 풀어 upgrade 한다. GitLab 토큰에 read_repository 스코프가 더 필요하다.
# 같은 볼륨 안에서 디렉터리가 달라, 다시 api 로 돌아가면 /data/docs 의 md 사본을 그대로 이어 쓴다.
env:
  COLLECT_MODE: api
  DOCS_DIR: /data/docs
  # COLLECT_MODE: clone
  # DOCS_DIR: /data/repos

# 같은 네임스페이스에 Qdrant 를 릴리스 이름 rag-qdrant 로 설치했다.
# 서비스 이름과 Qdrant API 키 Secret 이름이 그 릴리스 이름에서 나온다.
qdrant:
  url: http://rag-qdrant:6333
  apiKeySecret:
    name: rag-qdrant-apikey

# 검색 서버를 노드의 30876 포트로 연다.
# EC2 보안그룹에서 이 포트를 내 IP 에만 연다.
serve:
  service:
    type: NodePort
    nodePort: 30876

# 수집·색인 CronJob.
sync:
  # 03:00 를 한국 시간으로 계산한다. 없으면 EC2 의 UTC 기준이라 한국 시간 낮 12시에 돈다.
  timeZone: Asia/Seoul
  env:
    # 수집할 GitLab 그룹 경로다. 예: https://gitlab.com/mycompany/platform 이면 mycompany/platform.
    GITLAB_GROUP: ""
    # 사내 설치형 GitLab 이면 주소를 적는다. 없으면 https://gitlab.com 을 쓴다.
    # GITLAB_URL: https://gitlab.example.com

# k3s 에 기본으로 들어 있는 스토리지 클래스다. 노드 디스크에 저장된다.
# local-path 는 크기를 강제하지 않아 실제 한도는 EC2 디스크다. clone 이면 리포 약 80GiB 에 작업 트리까지
# 들어가므로 디스크에 160GiB 쯤 여유가 있어야 한다. docs 볼륨 크기(기본 5Gi)는 이미 만든 PVC 라
# local-path 에서 늘릴 수 없고, 늘릴 필요도 없어서 그대로 둔다.
persistence:
  storageClass: local-path
