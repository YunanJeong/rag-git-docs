# 이 배포의 값. 이 파일 하나로 설치한다.

image:
  repository: docker.wai/yunan/rag-git-docs
  tag: "0.6.3"

# 수집·색인과 검색 MCP 서버에 같이 넣는 환경변수. 수집 방식과 문서 위치, Qdrant 별칭, 인증 방식을 정한다.
env:
  # 수집 방식. 어느 쪽이든 Vector DB 에 색인하는 것은 md 뿐이다. 바꾸면 DOCS_DIR 과 persistence.docs.size 도 같이 바꾼다.
  #   api   : md 만 받는다
  #   clone : 리포 전체와 git 이력을 받아 둔다. 코드는 색인하지 않고, 코드 도구(search_code, read_code, code_history)가 필요할 때 직접 읽는다
  COLLECT_MODE: clone

  # 수집한 것을 두는 볼륨 안의 위치. 두 방식은 같은 위치를 쓰지 못하므로 방식을 바꾸면 이 경로도 바꾼다.
  DOCS_DIR: /data/repos

  # Qdrant 에서 문서 조각이 든 컬렉션(테이블에 해당)을 가리키는 별칭. 검색과 색인이 이 이름으로 접근한다.
  # 첫 색인 때 <별칭>_<시각> 컬렉션을 만들어 건다. Qdrant 하나를 여러 릴리스가 같이 쓰면 서로 다르게 준다.
  QDRANT_ALIAS: docs

  # MCP서버 인증 방식.
  #   token : 사람마다 나눠 준 토큰으로 붙는다. secretEnv.SERVE_TOKEN 이 필요하다
  #   none  : 인증 없음. 로컬 실행 전용이라 서버에서는 뜨지 않는다
  AUTH_MODE: token

# 같은 네임스페이스에 띄운 Qdrant(릴리스 rag-qdrant)의 주소와 API 키 Secret.
externalQdrant:
  url: http://rag-qdrant:6333
  apiKeySecret:
    name: rag-qdrant-apikey

# 검색 MCP 서버. 같은 서버에 릴리스를 하나 더 띄우면 노드 포트가 겹치지 않게 한다.
serve:
  enabled: true
  service:
    type: NodePort
    nodePort: 30876
  resources:
    requests:
      memory: 3Gi

# 수집·색인 CronJob. 같은 서버에 릴리스를 하나 더 띄우면 자원을 다투지 않게 시각을 엇갈린다.
sync:
  enabled: true
  schedule: "0 4 * * *"
  timeZone: Asia/Seoul
  env:
    # 문서를 받아 올 곳.
    #   gitlab : GITLAB_URL 의 GITLAB_GROUP 아래 리포를 받는다. 하위 그룹까지 받는다
    #   github : GITHUB_OWNER 계정이나 조직의 리포를 받는다
    SOURCE: gitlab

    # GitLab 주소. 사내 설치형이면 그 주소로 바꾼다.
    GITLAB_URL: https://gitlab.com

    # 수집할 GitLab 그룹 경로다. 그룹 주소에서 호스트 뒤 부분이다. 예: mycompany/platform. 하위 그룹까지 수집한다.
    GITLAB_GROUP: ""

    # SOURCE 가 github 일 때 수집할 계정이나 조직 이름.
    GITHUB_OWNER: ""
  resources:
    requests:
      memory: 3Gi

# 수집한 것과 수집 기록(.manifest.json)을 두는 docs 볼륨.
persistence:
  # false 면 볼륨 대신 파드마다 빈 임시 폴더(emptyDir)를 쓴다. 가볍게 띄워 보는 시험용이다.
  # 파드가 다시 뜨면 받은 것이 사라져 매번 전부 다시 받고, 검색 서버와 수집 파드가 폴더를 나눠 쓰지 못해 clone 의 코드 도구가 동작하지 않는다.
  # 문서 검색은 색인이 Qdrant 에 있어 그대로 된다.
  enabled: true

  storageClass: local-path

  # api 면 md 사본이라 작다. clone 이면 리포 저장소 크기 합계에 작업 트리만큼을 더해 잡는다.
  docs:
    size: 70Gi
    # 다른 릴리스가 만든 볼륨을 쓰려면 그 PVC 이름을 적는다. 그러면 이 차트는 볼륨을 만들지 않는다.
    existingClaim: ""
