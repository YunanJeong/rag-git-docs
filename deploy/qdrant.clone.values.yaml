# clone 모드 릴리스용 Qdrant 의 값. 노드 포트만 api 쪽과 다르다.
service:
  type: NodePort
  ports:
    - name: http
      port: 6333
      targetPort: 6333
      nodePort: 30634
      protocol: TCP
      checksEnabled: true
    - name: grpc
      port: 6334
      targetPort: 6334
      protocol: TCP
      checksEnabled: false
    - name: p2p
      port: 6335
      targetPort: 6335
      protocol: TCP
      checksEnabled: false

persistence:
  storageClassName: local-path

apiKey: true
