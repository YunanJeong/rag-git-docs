# clone 모드 PoC 용 Qdrant 를 같은 노드에 하나 더 띄울 때, qdrant.values.yaml 위에 덮어쓰는 값이다.
# 노드 포트는 클러스터 전체에서 하나라 api 쪽과 다르게 연다.
# ports 는 목록이라 일부만 적으면 나머지가 사라지므로 세 개를 모두 적는다.
service:
  ports:
    - name: http
      port: 6333
      targetPort: 6333
      nodePort: 30634
      protocol: TCP
      checksEnabled: true
    - name: grpc
      port: 6334
      targetPort: 6334
      protocol: TCP
      checksEnabled: false
    - name: p2p
      port: 6335
      targetPort: 6335
      protocol: TCP
      checksEnabled: false
